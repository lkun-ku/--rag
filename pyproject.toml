# =============================================================================
# 打包配置：把本项目做成**可安装包**（editable 安装）
#
# 为什么需要它：
#   源码根目录是 `RAG_PROJECT/`（`utils`、`documents`、`graph2`… 的父目录），
#   包内一律使用绝对导入（`from utils.env_utils import ...`）。若不做成可安装包，
#   只有 `python -m`（cwd=RAG_PROJECT/）或设置 PYTHONPATH 才能解析，
#   于是各模块顶部不得不写 `sys.path.insert(0, ...)` 兜底 —— 那是临时手段：
#   会污染全局 import 顺序、可能遮蔽同名第三方包（`tools`/`utils` 在 PyPI 上都有
#   同名包），并且**在被别人 import 时也产生副作用**。
#
# 标准做法（一次性）：
#   .venv\Scripts\python.exe -m pip install -e .
#
# 装完之后 `python xxx.py`、`python -m documents.xxx`、任意 cwd 下 import 均可正常工作，
# 源码仍就地修改、无需重装。
# =============================================================================
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-kb"
version = "0.1.0"
description = "企业知识库 RAG：多源入库 / 混合检索 / LangGraph 工作流 / HTTP 服务"
readme = "README.md"
requires-python = ">=3.12"
# 依赖**不在此处声明**：requirements.txt 是唯一事实来源（含版本锁定与安装顺序的
# 长注释），两处清单必然漂移。首次使用请先：pip install -r requirements.txt
dependencies = []

[tool.setuptools]
# 源码根目录：`rag_kb/` 的父目录就是 RAG_PROJECT/，不是仓库根
package-dir = { "" = "RAG_PROJECT" }

[tool.setuptools.packages.find]
# 只会找到 rag_kb 及其子包；datas/ models/ logs/ 没有 __init__.py，不会被当成包
where = ["RAG_PROJECT"]

[tool.ruff]
# 行宽 120：主流上限（black/ruff 默认 88，团队常见 100~120）。
# **不用 300** —— 1080p 屏幕在 100% 缩放下约 120 字符宽，300 需要横向滚动；
# 且 git diff 时会显示整行 300 字符，review 看不出改了哪里。
line-length = 120
target-version = "py312"

# 排除：模型目录、虚拟环境、缓存
extend-exclude = [
    ".venv",
    "RAG_PROJECT/models",
    "**/__pycache__",
    "scratch",
]

[tool.ruff.format]
# 保留原有引号风格 —— 避免「纯格式化」提交里混入大量引号变更，让 diff 更难 review
quote-style = "preserve"
# 只格式化 `.py`，不碰 Markdown
docstring-code-format = false

[tool.ruff.lint]
# 只开最基础的一组，避免一次性引入大量告警淹没真实问题
select = ["E", "F"]  # pycodestyle 错误 + pyflakes（未使用变量/导入）
ignore = [
    "E501",  # 行宽由 formatter 处理，lint 不重复报
    # 包内已不再有「先 sys.path 兜底再 import」（改由 editable 安装解决）；
    # 但 eval/、仓库根 scripts/ 下的独立诊断脚本仍需先备好环境再 import，故保留忽略。
    "E402",
]
