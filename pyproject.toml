# =============================================================================
# 打包配置：把本项目做成**可安装包**（editable 安装）
#
# 为什么需要它：
#   项目根下只有一个包 `rag_kb/`（agent / api / cli / documents / graph_react /
#   graph_crag / llm_models / tools / utils），包内一律使用绝对导入
#   （`from rag_kb.utils.env_utils import ...`）。若不做成可安装包，
#   只有设置 PYTHONPATH 才能解析，于是各模块顶部不得不写 `sys.path.insert(0, ...)`
#   兜底 —— 那是临时手段：会污染全局 import 顺序，并且**在被别人 import 时产生副作用**。
#
# 标准做法（一次性）：
#   .venv\Scripts\python.exe -m pip install -e .
#
# 装完之后 `python xxx.py`、`python -m rag_kb.doctor`、任意 cwd 下 import 均可正常工作，
# 源码仍就地修改、无需重装。
# =============================================================================
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-kb"
version = "0.1.0"
description = "企业知识库 RAG：多源入库 / 混合检索 / LangGraph 工作流 / HTTP 服务"
readme = "README.md"
requires-python = ">=3.12"
# 依赖**不在此处声明**：requirements.txt 是唯一事实来源（含版本锁定与安装顺序的
# 长注释），两处清单必然漂移。首次使用请先：pip install -r requirements.txt
dependencies = []

# CLI 入口：`pip install -e .` 之后可直接用 `rag-kb <子命令>`。
# 根目录 `main.py` 保留为兼容 shim，两者等价。
[project.scripts]
rag-kb = "rag_kb.cli.main:main"

[tool.setuptools]
# 源码根目录：`rag_kb/` 的父目录，即项目根
package-dir = { "" = "." }

[tool.setuptools.packages.find]
# 只收 rag_kb 及其子包；eval/ tests/ scripts/ models/ 都不在包内
where = ["."]
include = ["rag_kb*"]

[tool.pytest.ini_options]
# 只收集纯逻辑单测（不依赖 Milvus / LLM / 模型文件）；
# 端到端与检索层回归仍在 tests/run_all_checks.py 里按脚本执行。
testpaths = ["tests/unit"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["rag_kb"]
# 覆盖率只统计被单测实际导入的模块；端到端路径由脚本化回归覆盖。

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
# ============================================================================
# 类型检查：**基线模式**（strict=false），目标是「已注解代码自洽 + 不倒退」。
#
# 为什么不直接 strict：全项目当前 52% 函数有完整标注，strict 会一次产生上千条
# 告警，与「可执行的门禁」相悖。先固定基线，再按模块逐步收紧（见下方 overrides）。
#
# 为什么 ignore_missing_imports：主要依赖（langchain / pymilvus / pymupdf 等）
# 多数未随包分发 py.typed 或存根不完整，强开会让第三方类型缺失淹没自身问题。
# ============================================================================
python_version = "3.12"
files = ["rag_kb"]
ignore_missing_imports = true
# 未注解的函数体也参与检查：本次已修到 0 错误，作为基线保持，
# 避免「新写的未注解函数」成为检查盲区。
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
exclude = ['(?x)^(models|\.venv|scratch)/']

[tool.ruff]
# 行宽 120：主流上限（black/ruff 默认 88，团队常见 100~120）。
# **不用 300** —— 1080p 屏幕在 100% 缩放下约 120 字符宽，300 需要横向滚动；
# 且 git diff 时会显示整行 300 字符，review 看不出改了哪里。
line-length = 120
target-version = "py312"

# 排除：模型目录、虚拟环境、缓存
extend-exclude = [
    ".venv",
    "models",
    "**/__pycache__",
    "scratch",
]

[tool.ruff.format]
# 保留原有引号风格 —— 避免「纯格式化」提交里混入大量引号变更，让 diff 更难 review
quote-style = "preserve"
# 只格式化 `.py`，不碰 Markdown
docstring-code-format = false

[tool.ruff.lint]
# 只开最基础的一组，避免一次性引入大量告警淹没真实问题
select = ["E", "F"]  # pycodestyle 错误 + pyflakes（未使用变量/导入）
ignore = [
    "E501",  # 行宽由 formatter 处理，lint 不重复报
    # 包内已不再有「先 sys.path 兜底再 import」（改由 editable 安装解决）；
    # 但 eval/、仓库根 scripts/ 下的独立诊断脚本仍需先备好环境再 import，故保留忽略。
    "E402",
]
